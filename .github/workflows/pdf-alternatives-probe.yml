name: Source-Free PDF Engine Migration Probes

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-engine-probes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdfbox-probe:
    name: PDFBox 3.0.8 - Java 17 synthetic write/merge/read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: audit-pdfbox/pom.xml
      - name: Compile independent PDFBox probe
        run: mvn -B -ntp -f audit-pdfbox/pom.xml clean package
      - name: Execute ephemeral PDF write merge read test
        run: mvn -B -ntp -f audit-pdfbox/pom.xml org.codehaus.mojo:exec-maven-plugin:3.5.1:java -Dexec.mainClass=com.embasic.audit.pdfbox.PdfBoxProbe
      - name: Inspect Maven dependency tree and prohibit legacy iText
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f audit-pdfbox/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree | tee "$RUNNER_TEMP/pdfbox-deps.txt"
          if grep -E 'com.lowagie:itext|bouncycastle:.*:138' "$RUNNER_TEMP/pdfbox-deps.txt"; then
            echo "PDFBOX_PROBE: BLOCKED legacy PDF stack unexpectedly present" >&2
            exit 2
          fi

  openpdf-probe:
    name: OpenPDF 2.0.5 - Java 17 iText-like APIs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: audit-openpdf/pom.xml
      - name: Compile independent OpenPDF legacy-API probe
        run: mvn -B -ntp -f audit-openpdf/pom.xml compile
      - name: Execute ephemeral paragraph/table/merge smoke
        run: mvn -B -ntp -f audit-openpdf/pom.xml org.codehaus.mojo:exec-maven-plugin:3.5.1:java -Dexec.mainClass=com.embasic.audit.openpdf.OpenPdfProbe
      - name: Inspect OpenPDF Maven dependency tree
        run: mvn -B -ntp -f audit-openpdf/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree

# All PDFs are generated by source-free synthetic probes in runner temp dirs and removed.
# No application UDF, private Java, logo, copyright permission or GitHub artifact is uploaded.
# These probes DO NOT establish legal clearance, correct Turkish shaping or UYAP fidelity.
