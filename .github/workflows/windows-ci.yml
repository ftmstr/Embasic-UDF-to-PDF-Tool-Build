name: Windows Hosted CI (Secure Bootstrap)

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-gate:
    name: Source publication preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source gate unit tests (synthetic only)
        run: |
          python3 scripts/test-public-ci-gate.py
          python3 scripts/test-verify-snapshot-manifest.py
          python3 scripts/test-verify-private-rights-evidence.py
      - id: gate
        name: Enforce exact approved source commit or safe empty bootstrap
        env:
          PUBLIC_SOURCE_APPROVED_SHA: ${{ vars.PUBLIC_SOURCE_APPROVED_SHA }}
          REVIEWED_HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/public-ci-gate.py

  hosted-windows-probe:
    name: Hosted Windows + Java 17 + Maven probe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Probe Java, Maven and JDK toolchain (not an app test)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & java -version
          if ($LASTEXITCODE -ne 0) { throw "java not available" }
          & mvn -version
          if ($LASTEXITCODE -ne 0) { throw "maven not available" }
          $classes = Join-Path $env:RUNNER_TEMP "embasic-hosted-java-probe"
          New-Item -ItemType Directory -Force -Path $classes | Out-Null
          & javac --release 17 -d $classes scripts/HostedRunnerProbe.java
          if ($LASTEXITCODE -ne 0) { throw "javac probe compile failed" }
          & java -cp $classes HostedRunnerProbe
          if ($LASTEXITCODE -ne 0) { throw "java probe failed" }

      - name: Physical Windows hard-link preflight (synthetic runner volume)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probeDir = Join-Path $env:RUNNER_TEMP 'embasic-hardlink-preflight'
          New-Item -ItemType Directory -Path $probeDir -Force | Out-Null
          try {
            $probeOutput = @(& pwsh -NoProfile -File app/scripts/Test-UnsupportedHardLinkVolume.ps1 -Directory $probeDir 2>&1)
            $result = $LASTEXITCODE
            $probeText = ($probeOutput | Out-String)
            Write-Host $probeText
            if ($result -eq 0) {
              throw 'Runner volume reported native ERROR_NOT_SUPPORTED; this is not the expected supported-volume smoke.'
            }
            if ($result -ne 1) { throw "Unexpected preflight exit code: $result" }
            # Exit 1 alone is insufficient: PowerShell also returns 1 for
            # parser/runtime failures. Require the supported-volume marker.
            # Accept exactly one complete supported-volume marker. A partial,
            # duplicated or error-prefixed line must not turn exit 1 into PASS.
            $supportedMarkers = @($probeText -split '\\r?\\n' | Where-Object {
              $_ -match '^HARDLINK_SUPPORTED: Bu dizin unsupported-hardlink fiziksel GUI kabulü için uygun değil\\.
            if ($probeText -match 'HARDLINK_UNSUPPORTED|HARDLINK_INDETERMINATE') {
              throw 'Conflicting or indeterminate hard-link result; fail closed.'
            }
            $remaining = @(Get-ChildItem -LiteralPath $probeDir -Force)
            if ($remaining.Count -ne 0) { throw 'Synthetic hard-link probe left temporary files behind.' }
            Write-Host 'SUPPORTED_VOLUME_PREFLIGHT_PASS: Windows runner hard-link probe safely rejected unsupported-volume acceptance.'
          } finally {
            Remove-Item -LiteralPath $probeDir -Recurse -Force -ErrorAction SilentlyContinue
          }
          # A supported volume intentionally makes the child probe exit 1.
          # PowerShell preserves that native exit status unless this step explicitly succeeds.
          exit 0

  application-regression:
    name: Maven + Java regression + synthetic UDF/PDF smoke
    needs: [public-source-gate]
    if: needs.public-source-gate.outputs.ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Standalone Explorer selection and ordering tests
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/verify-explorer-grid.ps1
          if ($LASTEXITCODE -ne 0) { throw "Explorer regression failed" }
      - name: Standalone UDF parser security and compatibility tests
        shell: pwsh
        run: |
          & pwsh -NoProfile -File scripts/verify-udf-parser.ps1
          if ($LASTEXITCODE -ne 0) { throw "UDF parser regression failed" }
      - name: Maven clean verify (compile + configured tests)
        shell: pwsh
        run: |
          & mvn -B -ntp clean verify
          if ($LASTEXITCODE -ne 0) { throw "Maven verify failed" }
      - name: Synthetic single-UDF to PDF smoke (no real UYAP documents)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $jar = "target/embasic-udf-to-pdf-1.4.0-all.jar"
          if (-not (Test-Path $jar)) { throw "Shaded application JAR missing" }
          & python scripts/create-smoke-udf.py build/smoke/sample.udf SMOKE-A 1 1
          if ($LASTEXITCODE -ne 0) { throw "Synthetic fixture generation failed" }
          & java -jar $jar build/smoke/sample.udf build/smoke/sample.pdf
          if ($LASTEXITCODE -ne 0) { throw "Synthetic conversion failed" }
          $classes = Join-Path $env:RUNNER_TEMP "embasic-pdf-smoke-classes"
          New-Item -ItemType Directory -Force -Path $classes | Out-Null
          & javac -cp $jar -d $classes scripts/PdfSmokeVerifier.java
          if ($LASTEXITCODE -ne 0) { throw "PDF smoke verifier compile failed" }
          & java -cp "$jar;$classes" PdfSmokeVerifier build/smoke/sample.pdf 1 "595.28x841.89::SMOKE-A"
          if ($LASTEXITCODE -ne 0) { throw "PDF content smoke failed" }

  approved-package:
    name: Verified Windows app-image, portable ZIP and SHA-256 (approved only)
    needs: [public-source-gate, application-regression]
    if: |
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.public-source-gate.outputs.ready == 'true' &&
      vars.PUBLIC_BINARY_APPROVED_SHA == github.sha &&
      vars.PUBLIC_RIGHTS_APPROVED_SHA == github.sha
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile and verify actual binary dependencies and licenses
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & mvn -B -ntp clean package
          if ($LASTEXITCODE -ne 0) { throw "Maven package failed" }
          & mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies "-DoutputDirectory=target/runtime-dependencies" "-DincludeScope=runtime"
          if ($LASTEXITCODE -ne 0) { throw "Maven dependency resolution failed" }
          & python scripts/audit-cached-maven.py --maven-cache "$HOME/.m2/repository"
          if ($LASTEXITCODE -ne 0) { throw "Maven six-coordinate upstream audit failed" }
          & python scripts/audit-shaded-classes.py --mode application --maven-cache "$HOME/.m2/repository" --shaded-jar target/embasic-udf-to-pdf-1.4.0-all.jar
          if ($LASTEXITCODE -ne 0) { throw "Application shaded class integrity failed" }
          # Binary hash checks cannot certify MPL/LGPL compliance or legal permission.
      - name: Create Windows app-image and portable ZIP (no installer/release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & jpackage --type app-image --name EmbasicUdfToPdf --input target --main-jar embasic-udf-to-pdf-1.4.0-all.jar --main-class com.embasic.udf2pdf.App --app-version 1.4.0 --dest dist
          if ($LASTEXITCODE -ne 0) { throw "Windows jpackage failed" }
          Copy-Item THIRD-PARTY-iText.txt dist/EmbasicUdfToPdf/
          Copy-Item THIRD-PARTY-NOTICES.txt dist/EmbasicUdfToPdf/
          Compress-Archive -Path dist/EmbasicUdfToPdf -DestinationPath dist/Embasic-UDF-to-PDF-Tool-Windows-x64.zip -Force
          & python scripts/check-portable-notices.py --portable-zip dist/Embasic-UDF-to-PDF-Tool-Windows-x64.zip --itext-notice THIRD-PARTY-iText.txt --third-party-notices THIRD-PARTY-NOTICES.txt
          if ($LASTEXITCODE -ne 0) { throw "Portable ZIP notice byte integrity failed" }
          $jar = Get-FileHash target/embasic-udf-to-pdf-1.4.0-all.jar -Algorithm SHA256
          $zip = Get-FileHash dist/Embasic-UDF-to-PDF-Tool-Windows-x64.zip -Algorithm SHA256
          @("$($jar.Hash)  embasic-udf-to-pdf-1.4.0-all.jar", "$($zip.Hash)  Embasic-UDF-to-PDF-Tool-Windows-x64.zip") | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: embasic-udf-to-pdf-windows-verified
          path: |
            target/embasic-udf-to-pdf-1.4.0-all.jar
            dist/Embasic-UDF-to-PDF-Tool-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

            })
            if ($supportedMarkers.Count -ne 1) {
              throw 'Preflight exited 1 without exactly one canonical HARDLINK_SUPPORTED marker; fail closed.'
            }
            if ($probeText -match 'HARDLINK_UNSUPPORTED|HARDLINK_INDETERMINATE') {
              throw 'Conflicting or indeterminate hard-link result; fail closed.'
            }
            $remaining = @(Get-ChildItem -LiteralPath $probeDir -Force)
            if ($remaining.Count -ne 0) { throw 'Synthetic hard-link probe left temporary files behind.' }
            Write-Host 'SUPPORTED_VOLUME_PREFLIGHT_PASS: Windows runner hard-link probe safely rejected unsupported-volume acceptance.'
          } finally {
            Remove-Item -LiteralPath $probeDir -Recurse -Force -ErrorAction SilentlyContinue
          }
          # A supported volume intentionally makes the child probe exit 1.
          # PowerShell preserves that native exit status unless this step explicitly succeeds.
          exit 0

