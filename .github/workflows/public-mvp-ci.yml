name: Public-only Desktop MVP Proof

on:
  push:
    branches: [main, "ci/**"]
    paths:
      - "app/**"
      - ".github/workflows/public-mvp-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/public-mvp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-mvp:
    name: Build and smoke public MVP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: app/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system font for Linux smoke
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Compile + JUnit test + shaded JAR build (no binary publication)
        run: mvn -B -ntp -f app/pom.xml clean verify
      - name: CLI synthetic UDF to PDF smoke
        run: python app/scripts/smoke_cli.py app/target/embasic-public-desktop-0.1.0-SNAPSHOT-all.jar


      - name: Build portable Windows app-image (CI validation only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & jpackage --type app-image --name EmbasicUdfToPdfPublicMVP --app-version 0.1.0 --input app/target --main-jar embasic-public-desktop-0.1.0-SNAPSHOT-all.jar --main-class com.embasic.publicapp.DesktopApp --dest app/target/win-image
          if ($LASTEXITCODE -ne 0) { throw "Windows app-image packaging failed" }
          $launcher = "app/target/win-image/EmbasicUdfToPdfPublicMVP/EmbasicUdfToPdfPublicMVP.exe"
          if (-not (Test-Path -LiteralPath $launcher)) { throw "Packaged launcher not found" }
          & python app/scripts/smoke_packaged.py $launcher
          if ($LASTEXITCODE -ne 0) { throw "Packaged launcher conversion failed" }

# Does not publish executable artifacts or bypass source/license/rights release gates.
