name: Synthetic Page Layout Proof
on:
  push:
    branches: [main, "ci/**"]
    paths:
      - "audit/src/main/java/com/embasic/audit/fidelity/**"
      - "audit/pom.xml"
      - "audit-content/**"
      - ".github/workflows/synthetic-page-layout.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: audit/pom.xml
      - name: Install open-source test fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-dejavu-core
      - name: Compile synthetic Java probes
        run: mvn -B -ntp -f audit/pom.xml -Dmaven.compiler.release=17 clean package
      - name: Resolve runtime classpath
        run: mvn -B -ntp -f audit/pom.xml dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/embasic-cp.txt"
      - name: Run synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          CP="audit/target/classes:$(cat "$RUNNER_TEMP/embasic-cp.txt")"
          java -Djava.awt.headless=true -cp "$CP" com.embasic.audit.fidelity.DocumentModelAdapterTest
          java -Djava.awt.headless=true -cp "$CP" com.embasic.audit.fidelity.SyntheticUdfLayoutTest
          java -Djava.awt.headless=true -cp "$CP" com.embasic.audit.fidelity.UdfXmlModelAdapterTest
          java -Djava.awt.headless=true -cp "$CP" com.embasic.audit.fidelity.XmlToPageLayoutTest
          java -Djava.awt.headless=true -cp "$CP" com.embasic.audit.fidelity.TableGeometryTest
          java -Djava.awt.headless=true -cp "$CP" com.embasic.audit.fidelity.TablePageRendererTest
          java -Djava.awt.headless=true -cp "$CP" com.embasic.audit.fidelity.SyntheticXmlTableBridgeTest
          java -Djava.awt.headless=true -cp "$CP" com.embasic.audit.fidelity.MixedDocumentFlowTest
          java -Djava.awt.headless=true -cp "$CP" com.embasic.audit.fidelity.UnifiedDocumentPipelineTest
          java -Djava.awt.headless=true -cp "$CP" com.embasic.audit.fidelity.UnifiedRobustnessTest
      - name: Install legacy audit fixture classes for independent oracle
        run: mvn -B -ntp -f audit/pom.xml -DskipTests install
      - name: Compile and run separate PDFBox content oracle
        run: mvn -B -ntp -f audit-content/pom.xml compile org.codehaus.mojo:exec-maven-plugin:3.5.1:java -Dexec.mainClass=com.embasic.audit.fidelity.VectorPdfContentOracle -Dexec.cleanupDaemonThreads=false -Djava.awt.headless=true

# Contains only independent synthetic sources; not an authentic UDF fidelity certification.
